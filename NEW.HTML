<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Glass UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #080014;
            position: relative;
        }

        /* =========================
   ANIMATED BACKGROUND
========================= */

        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #7c3aed;
            border-radius: 50%;
            filter: blur(120px);
            top: -250px;
            left: -150px;
            animation: blob1 8s infinite alternate ease-in-out;
        }

        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: #00eaff;
            border-radius: 50%;
            filter: blur(120px);
            bottom: -250px;
            right: -150px;
            animation: blob2 10s infinite alternate ease-in-out;
        }

        @keyframes blob1 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(250px, 150px) scale(1.3);
            }

            100% {
                transform: translate(100px, 300px) scale(.8);
            }
        }

        @keyframes blob2 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-200px, -150px) scale(1.4);
            }

            100% {
                transform: translate(-50px, -300px) scale(.8);
            }
        }


        /* =========================
   FLOATING PARTICLES
========================= */

        .particles span {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00eaff;
            animation: particles 8s linear infinite;
        }

        .particles span:nth-child(1) {
            left: 10%;
            top: 80%;
            animation-delay: 0s;
        }

        .particles span:nth-child(2) {
            left: 20%;
            top: 50%;
            animation-delay: 2s;
        }

        .particles span:nth-child(3) {
            left: 35%;
            top: 90%;
            animation-delay: 4s;
        }

        .particles span:nth-child(4) {
            left: 60%;
            top: 80%;
            animation-delay: 1s;
        }

        .particles span:nth-child(5) {
            left: 75%;
            top: 60%;
            animation-delay: 3s;
        }

        .particles span:nth-child(6) {
            left: 90%;
            top: 90%;
            animation-delay: 5s;
        }

        @keyframes particles {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            50% {
                transform: translateY(-300px) translateX(50px) scale(1.5);
            }

            100% {
                transform: translateY(-700px) translateX(-50px) scale(.2);
                opacity: 0;
            }
        }


        /* =========================
   GLASS CARD
========================= */

        .card {
            position: relative;
            z-index: 10;
            width: 390px;
            padding: 45px 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, .6),
                inset 0 0 30px rgba(255, 255, 255, .05);

            animation: cardEnter 1.2s cubic-bezier(.17, .67, .32, 1.3);
            transition: .5s;
        }

        @keyframes cardEnter {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(.7) rotateX(30deg);
            }

            70% {
                transform: translateY(-15px) scale(1.03);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
            }
        }

        .card:hover {
            transform: translateY(-12px) rotateX(2deg) rotateY(-2deg);

            box-shadow:
                0 40px 100px rgba(0, 0, 0, .7),
                0 0 60px rgba(0, 234, 255, .2);
        }


        /* =========================
   ICON
========================= */

        .icon {
            width: 90px;
            height: 90px;

            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 40px;

            background:
                linear-gradient(135deg,
                    #7c3aed,
                    #06b6d4);

            box-shadow:
                0 0 25px #06b6d4;

            animation:
                iconFloat 3s ease-in-out infinite,
                iconGlow 2s ease-in-out infinite alternate;
        }

        @keyframes iconFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-12px) rotate(5deg);
            }
        }

        @keyframes iconGlow {
            from {
                box-shadow: 0 0 20px #06b6d4;
            }

            to {
                box-shadow:
                    0 0 50px #7c3aed,
                    0 0 80px #06b6d4;
            }
        }


        /* =========================
   TITLE
========================= */

        h1 {
            margin-top: 25px;

            font-size: 34px;

            background:
                linear-gradient(90deg,
                    #fff,
                    #67e8f9,
                    #c084fc,
                    #fff);

            background-size: 300%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: textGradient 4s linear infinite;
        }

        @keyframes textGradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }


        /* =========================
   DESCRIPTION
========================= */

        p {
            color: #cbd5e1;

            margin: 15px 0 30px;

            line-height: 1.6;

            animation: fadeText 2s ease;
        }

        @keyframes fadeText {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
   BUTTONS
========================= */

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            position: relative;

            overflow: hidden;

            border: none;

            padding: 14px 25px;

            border-radius: 30px;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: .4s;
        }

        button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, .6),
                    transparent);

            transform: skewX(-25deg);

            transition: .6s;
        }

        button:hover::before {
            left: 130%;
        }

        button:hover {
            transform: translateY(-5px) scale(1.08);
        }


        /* PRIMARY */

        .primary {
            background:
                linear-gradient(90deg,
                    #7c3aed,
                    #06b6d4,
                    #7c3aed);

            background-size: 200%;

            box-shadow:
                0 0 25px rgba(6, 182, 212, .5);

            animation: buttonGradient 3s linear infinite;
        }

        @keyframes buttonGradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 200%;
            }
        }

        .primary:hover {
            box-shadow:
                0 0 25px #06b6d4,
                0 0 50px #7c3aed;
        }


        /* SECONDARY */

        .secondary {
            background: rgba(255, 255, 255, .08);

            border: 1px solid rgba(255, 255, 255, .25);
        }

        .secondary:hover {
            background: rgba(255, 255, 255, .18);
        }


        /* =========================
   STATUS
========================= */

        .status {
            margin-top: 28px;

            color: #67e8f9;

            font-size: 13px;

            animation: statusFade 2s ease;
        }

        @keyframes statusFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            background: #22c55e;

            border-radius: 50%;

            margin-right: 6px;

            box-shadow: 0 0 10px #22c55e;

            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 8px #22c55e;
            }

            50% {
                transform: scale(1.5);
                box-shadow:
                    0 0 20px #22c55e,
                    0 0 35px #22c55e;
            }
        }


        /* =========================
   MOBILE
========================= */

        @media (max-width: 500px) {

            .card {
                width: 90%;
                padding: 40px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Floating particles -->
    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- Main Card -->
    <div class="card">

        <div class="icon">
            🚀
        </div>

        <h1>Welcome!</h1>

        <p>
            Build something beautiful with modern HTML and CSS.
            Smooth animations, glass effects and glowing UI.
        </p>

        <div class="buttons">

            <button class="primary">
                Get Started
            </button>

            <button class="secondary">
                Explore
            </button>

        </div>

        <div class="status">
            <span class="dot"></span>
            System Online
        </div>

    </div>





    
</body>

</html>
